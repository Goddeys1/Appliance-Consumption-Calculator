<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEHM Appliance Consumption Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>JEHM Appliance Consumption Calculator</h1>

        <div class="toolbar">
            <label class="toolbar-item" for="currencySelector">
                Currency
                <select id="currencySelector">
                    <option value="GHS">GHS</option>
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="EUR">EUR</option>
                </select>
            </label>

            <button type="button" id="themeToggle" class="theme-toggle">Dark Mode</button>
        </div>

        <marquee behavior="scroll" direction="left" scrollamount="3" scrolldelay="25" style="background: linear-gradient(90deg, #0b63f6, #5b9cff); color: #ffffff; padding: 14px 18px; font-size: 17px; font-weight: 700; border-radius: 12px; margin-top: 15px; box-shadow: 0 10px 20px rgba(11, 99, 246, 0.25);">
            Welcome to JEHM Appliance Consumption Calculator! Select your appliances, specify their details, and calculate your energy costs effortlessly. 🌟 Appliances with (N.R) beside them are not rated.
        </marquee>
        <form id="calculatorForm">
            <div id="appliancesContainer">
                <div class="form-group appliance-entry">
                    <label for="appliance">Appliance Name:</label>
                    <select class="appliance-select" name="appliance">
                        <option value="Choose">---Choose---</option>
                        <option value="Laptop">Laptop (N.R)</option>
                        <option value="Refrigerator">Refrigerator</option>
                        <option value="Air Conditioner">Air Conditioner</option>
                        <option value="Washing Machine">Washing Machine</option>
                        <option value="LED TV">LED TV</option>
                        <option value="Computer">Computer</option>
                        <option value="Steam Iron">Steam Iron (N.R)</option>
                        <option value="Dry Iron">Dry Iron (N.R)</option>
                        <option value="Sound System">Sound System (N.R)</option>
                        <option value="Desktop Computer">Desktop Computer (N.R)</option>
                    </select>

                    <label for="isRated">Is it Rated?</label>
                    <select class="is-rated-select" name="isRated">
                        <option value="Choose">---Choose---</option>
                        <option value="not-rated">Not Rated</option>
                        <option value="rated">Rated</option>
                    </select>

                    <label for="starRating">Star Rating (Rated Appliances Only):</label>
                    <select class="star-rating-select" name="starRating">
                        <option value="Choose">---Choose---</option>
                        <option value="5-star">5-Star</option>
                        <option value="4-star">4-Star</option>
                        <option value="3-star">3-Star</option>
                        <option value="2-star">2-Star</option>
                        <option value="1-star">1-Star</option>
                    </select>

                    <label for="hoursUsed">Hours Used Per Day:</label>
                    <input type="number" class="hours-used-input" name="hoursUsed" min="1" required>

                    <label for="daysUsed">Days Used Per Month:</label>
                    <input type="number" class="days-used-input" name="daysUsed" min="1" max="31" required>

                    <button type="button" class="remove-appliance">Remove Appliance</button>
                </div>
            </div>
            <button type="button" id="addAppliance">Add Appliance</button>
            <div class="button-row">
                <button type="button" id="calculate">Calculate</button>
                <button type="button" id="resetCalculator" class="secondary-button">Reset</button>
            </div>
        </form>
        <div id="results"></div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <img class="profile-photo" src="images/my-photo.jpg.jpeg" alt="Engineer Godwin" />
            <p class="credit-line">Engineer Godwin</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
